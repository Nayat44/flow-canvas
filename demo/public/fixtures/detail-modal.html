<!doctype html>
<html><head><meta charset="utf-8"><title>New record</title><link rel="stylesheet" href="shell.css"></head>
<body>
<div class="bar"><strong>Acme</strong><a>Records</a><a>Settings</a><div class="spacer"></div><div class="avatar"></div></div>
<div class="page">
  <div class="head"><h1>Northwind draft</h1><div class="spacer"></div><button class="btn">New record</button></div>
  <div class="table">
    <div class="row"><span class="name">Owner</span><span class="meta">Dana Whitfield</span><span class="spacer"></span></div>
    <div class="row"><span class="name">State</span><span class="meta">In review</span><span class="spacer"></span><span class="pill">In review</span></div>
    <div class="row"><span class="name">Created</span><span class="meta">12 January 2026</span><span class="spacer"></span></div>
    <div class="row"><span class="name">Last change</span><span class="meta">2 days ago by Dana</span><span class="spacer"></span></div>
  </div>
</div><div class="overlay"></div>
<div class="modal">
  <h2>New record</h2>
  <p>Give it a name and pick an owner. You can change both later.</p>
  <div class="field"><label>Name</label><div class="input"></div></div>
  <div class="field"><label>Owner</label><div class="input"></div></div>
  <div class="actions"><button class="btn btn--ghost">Cancel</button><div class="grow"></div><button class="btn">Continue</button></div>
</div>
</body></html>
